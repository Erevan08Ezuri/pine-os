name: Tab5 firmware
on:
  push:
    branches: [main, codex/tab5-ready]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tab5-${{ github.ref }}
  cancel-in-progress: true
jobs:
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned dependencies
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          python platform/tab5/prepare.py
      - name: Build ESP32-P4 firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          python platform/tab5/tab5.py build
          idf.py -C platform/tab5 size
      - name: Package firmware
        shell: bash
        run: |
          mkdir -p firmware/bootloader firmware/partition_table
          cp platform/tab5/build/pine_tab5.bin firmware/
          cp platform/tab5/build/bootloader/bootloader.bin firmware/bootloader/
          cp platform/tab5/build/partition_table/partition-table.bin firmware/partition_table/
          cp platform/tab5/build/flasher_args.json firmware/
          cp docs/TAB5.md firmware/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: PineOS-Tab5
          path: firmware/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tab5-build-diagnostics
          path: |
            platform/tab5/sdkconfig
            platform/tab5/dependencies.lock
            platform/tab5/build/log/
  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build desktop
        run: |
          cmake -S . -B build/desktop -DCMAKE_BUILD_TYPE=Release -DSDL_X11=OFF -DSDL_WAYLAND=OFF -DSDL_UNIX_CONSOLE_BUILD=ON
          cmake --build build/desktop --parallel 2
          ctest --test-dir build/desktop --output-on-failure
      - name: Render desktop acceptance scenarios
        env:
          SDL_VIDEODRIVER: dummy
        run: build/desktop/bin/pine --data=build/acceptance-data --acceptance=build/acceptance-images
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Desktop-acceptance-images
          path: build/acceptance-images/
      - name: Exercise Tab5 SQLite VFS on host
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'platform/tab5')
          from prepare import replace_required
          replace_required(Path('build/desktop/_deps/sqlite-src/sqlite3.c'),
              '#if SQLITE_THREADSAFE && !defined(SQLITE_MUTEX_NOOP)',
              '#if SQLITE_THREADSAFE && !defined(SQLITE_MUTEX_NOOP) && !defined(SQLITE_MUTEX_PTHREADS)')
          PYTHON
          cc -O1 -DSQLITE_OS_OTHER=1 -DSQLITE_THREADSAFE=1 -DSQLITE_MUTEX_PTHREADS=1 -DSQLITE_OMIT_LOAD_EXTENSION=1 -DSQLITE_OMIT_WAL=1 -DSQLITE_TEMP_STORE=3 -c build/desktop/_deps/sqlite-src/sqlite3.c -o /tmp/pine_sqlite.o
          c++ -std=c++20 -Isrc -Ibuild/desktop/_deps/sqlite-src platform/tab5/components/pine_sqlite/pine_vfs.cpp tests/tab5_vfs_tests.cpp /tmp/pine_sqlite.o -lpthread -o /tmp/pine_vfs_tests
          /tmp/pine_vfs_tests
